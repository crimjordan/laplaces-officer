name: Update research data
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      city_batch:
        description: 'Five-city batch (auto or 0–4)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch research and surveillance
        env:
          OHSOME_API_KEY: ${{ secrets.OHSOME_API_KEY }}
          CITY_BATCH: ${{ inputs.city_batch || 'auto' }}
        run: |
          python scripts/update.py
          python scripts/update_osm.py
      - name: Commit validated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update research and surveillance snapshots"
            git push
          fi
