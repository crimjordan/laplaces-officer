name: Deploy Laplace's Officer to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check GENESIS engine, reports and navigation
        run: node scripts/test-genesis.cjs
      - name: Check GENESIS cinematic rendering and fallback
        run: node scripts/test-genesis-visuals.cjs
      - name: Verify GENESIS factorial and controlled experiment research lab
        run: node scripts/test-genesis-experiments.cjs
      - name: Smoke test GENESIS factorial UI and research report buttons
        run: node scripts/test-genesis-experiment-ui.cjs
      - name: Verify GENESIS SOVEREIGN geographies, research mechanisms and reports
        run: node scripts/test-sovereign.cjs
      - name: Smoke test SOVEREIGN interactive controls, regional rollouts and report exports
        run: node scripts/test-sovereign-ui.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
